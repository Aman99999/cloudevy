app = "cloudevy-frontend"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  # The frontend's nginx proxies /api to the backend over Fly's private network.
  BACKEND_HOST = "cloudevy-backend.internal"
  BACKEND_PORT = "8002"
  # Fly's internal DNS resolver (IPv6 link-local).
  DNS_RESOLVER = "[fdaa::3]"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
